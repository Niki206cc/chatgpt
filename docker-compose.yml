services:
  automazione-articoli:
    build: .
    container_name: automazione-articoli
    restart: unless-stopped
    ports:
      - "8088:8080"
    environment:
      - TZ=Europe/Rome
      - DATA_DIR=/data
      - ATTACHMENTS_DIR=/attachments
    volumes:
      - automazione_articoli_data:/data
      - automazione_articoli_attachments:/attachments

volumes:
  automazione_articoli_data:
  automazione_articoli_attachments:
