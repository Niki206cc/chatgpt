{% extends "base.html" %}
{% block content %}
<form class="card" method="post" action="{{ url_for('send_preview_route', index=index) }}">
  <h2>Anteprima articolo</h2>
  <label>Titolo / oggetto email
    <input name="article_title" value="{{ article_title }}">
  </label>
  <label>Articolo HTML per WordPress
    <textarea name="html_article" rows="22">{{ html_article }}</textarea>
  </label>

  <div class="row">
    <label>Immagine da allegare
      <select name="image_filename">
        <option value="">Nessuna immagine</option>
        {% for img in image_names %}
          <option value="{{ img }}" {% if img == selected_image %}selected{% endif %}>{{ img }}</option>
        {% endfor %}
      </select>
    </label>
    <label>Mittente conferma
      <input name="sender_email" value="{{ sender_email }}">
    </label>
  </div>

  {% if image_names %}
    <h3>Anteprima immagini disponibili</h3>
    <div class="thumb-grid">
      {% for img in image_names %}
        <a class="thumb" href="{{ url_for('view_attachment', filename=img) }}" target="_blank" title="{{ img }}">
          <img src="{{ url_for('view_attachment', filename=img) }}" alt="{{ img }}">
          <span>{% if img == selected_image %}⭐ {% endif %}{{ img }}</span>
        </a>
      {% endfor %}
    </div>
  {% endif %}

  <label class="check">
    <input type="checkbox" name="send_confirmation" {% if sender_email %}checked{% endif %}>
    Invia conferma di presa in carico al mittente
  </label>

  <label class="check">
    <input type="checkbox" name="delete_after_send" checked>
    Dopo l’invio cancella automaticamente la mail originale
  </label>

  <button class="btn primary" type="submit">Invia questa mail</button>
</form>
{% endblock %}
